<main>

  <section class="hero wrap">
    <p class="case-number">FILE 07 / CONTACT / INTAKE</p>
    <h1>Start a Project</h1>
  </section>

  <hr class="tape-rule">

  <section class="section wrap">
    <form class="form-shell" data-form="intake" action="http://localhost:3123/api/submissions" method="POST">
      <input type="hidden" name="form" value="intake">

      <div class="field">
        <label for="name">Name / Studio Name</label>
        <input type="text" id="name" name="name" placeholder="Your name or studio banner" required>
      </div>

      <div class="field">
        <label for="email">Contact Email</label>
        <input type="email" id="email" name="email" placeholder="you@studio.com" required>
      </div>

      <div class="field">
        <label for="project-title">Project Title</label>
        <input type="text" id="project-title" name="project_title" placeholder="Name of your game or project" required>
      </div>

      <div class="field">
        <label for="engagement">Engagement Type / Service Needed</label>
        <select id="engagement" name="engagement" required>
          <option value="">Select an engagement type</option>
          <option>Tier I: Discovery Consultation</option>
          <option>Tier II: Production Retainer</option>
          <option>Tier III: Project Milestone</option>
          <option>Individual Service (Audio, Sound Design, Cinematics, etc.)</option>
          <option>Custom Co-Development / Revenue-Share Inquiry</option>
        </select>
      </div>

      <div class="field">
        <label for="timeline">Estimated Timeline / Target Window</label>
        <input type="text" id="timeline" name="timeline" placeholder="e.g., Q4 2026, Steam Next Fest, Immediate start">
      </div>

      <div class="field">
        <label for="budget">Estimated Budget Range</label>
        <select id="budget" name="budget">
          <option value="">Select a budget range</option>
          <option>Under $1,000 (Audits / Small Scope)</option>
          <option>$1,000 &ndash; $3,000 (Retainers / Mid-Scope)</option>
          <option>$3,000 &ndash; $8,000+ (Full Milestones / OST)</option>
          <option>Open to discussion / Royalty &amp; Revenue-Share Structure</option>
        </select>
      </div>

      <div class="field">
        <label for="project-details">Project Details / Message</label>
        <textarea id="project-details" name="message" rows="5" placeholder="What are you building, what do you need help with, and any context for your target window or budget?" required></textarea>
      </div>

      <div class="field">
        <label class="field-check" for="consent">
          <input type="checkbox" id="consent" name="consent" required>
          I understand this is an initial inquiry &mdash; not a binding quote,
          offer, or contract.
        </label>
      </div>

      <button type="submit" class="btn btn-block">Send Inquiry</button>
      <p class="form-note form-status" aria-live="polite"></p>
    </form>
  </section>
